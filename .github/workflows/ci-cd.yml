name: CI/CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release job raises what it needs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true

jobs:
  native:
    name: native runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SBML4HUMANS_BUILD_CACHE: /tmp/sbml4humans-build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
      - name: Install the parser toolchain and native WASM target
        run: rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install native validation build dependencies
        run: sudo apt-get update && sudo apt-get install --yes g++ cmake make libexpat1-dev zlib1g-dev libbz2-dev
      - name: Cache the pinned native validation library
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v6  # zizmor: ignore[cache-poisoning]
        with:
          path: /tmp/sbml4humans-build/libsbml/**/prefix
          key: libsbml-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/sbml4humans/native-source.json') }}
          restore-keys: libsbml-${{ runner.os }}-${{ runner.arch }}-
      - name: Rebuild and verify the pinned browser package; build the native wheel
        run: python3 scripts/build_parser.py --check --verify-build --wheel-out /tmp/parser-wheels
      - uses: actions/upload-artifact@v7
        with:
          name: native-runtime
          path: /tmp/parser-wheels/*.whl
          if-no-files-found: error

  test:
    # required by the branch protection, see .github/rulesets/develop.json
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: native
    env:
      SBML4HUMANS_NATIVE_WHEEL: /tmp/sbml4humans-native-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: true
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: true
      - name: Download the exact native runtime
        uses: actions/download-artifact@v8
        with:
          name: native-runtime
          path: /tmp/sbml4humans-native-runtime
      - name: Install the backend
        working-directory: backend
        run: uv sync --locked
      - name: Test the backend
        # in parallel (pytest-xdist); the tests marked `slow` and the other python
        # versions run locally, see docs/development.md. The slowest tests are
        # listed, so that a test which becomes slow is seen
        working-directory: backend
        run: uv run pytest -n 2 -m "not slow" --durations=15

  schema:
    # required by the branch protection, see .github/rulesets/develop.json
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: true
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: true
      - name: Install the backend
        working-directory: backend
        run: uv sync --locked --no-install-project
      - name: Check that the committed JSON schema is current
        working-directory: backend
        run: |
          uv run --no-sync python -m sbml4humans.schema /tmp/schema
          diff -r /tmp/schema ../frontend/src/schema

  frontend:
    # required by the branch protection, see .github/rulesets/develop.json
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend
        working-directory: frontend
        run: npm ci
      - name: Check that the generated types are current
        working-directory: frontend
        run: |
          npm run types
          git diff --exit-code -- src/types/report.ts src/types/annotation.ts src/types/validation.ts
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Build, which fails on a chunk above 500 kB (frontend/chunkSizeLimit.ts)
        working-directory: frontend
        run: npm run build

  e2e:
    # required by the branch protection, see .github/rulesets/develop.json
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: native
    env:
      SBML4HUMANS_NATIVE_WHEEL: /tmp/sbml4humans-native-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: true
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: true
      - name: Download the exact native runtime
        uses: actions/download-artifact@v8
        with:
          name: native-runtime
          path: /tmp/sbml4humans-native-runtime
      - name: Install the backend
        working-directory: backend
        run: uv sync --locked
      - name: Start the backend
        working-directory: backend
        # the url input is tested with a model served on 127.0.0.1
        env:
          SBML4HUMANS_ALLOW_PRIVATE_URLS: "1"
        run: |
          uv run uvicorn sbml4humans.api:api --port 1444 &
          for i in $(seq 1 30); do curl -fs http://localhost:1444/api/examples > /dev/null && break; sleep 1; done
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache the browser of Playwright
        # the chromium of the Playwright release in the lock file, downloaded once; a
        # release run restores no cache, which zizmor cannot tell from the condition
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@v6  # zizmor: ignore[cache-poisoning]
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install the frontend
        # `--with-deps` installs the system libraries of chromium, which are not cached;
        # the browser itself is not downloaded again when it was restored
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End to end tests
        # the walk over every example is tagged `@slow` and runs locally only
        working-directory: frontend
        run: npm run test:e2e -- --grep-invert @slow
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  package:
    # the python package as a user installs it: the wheel with the built frontend in it,
    # installed into an environment of its own, opens the report of a file
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: native
    env:
      SBML4HUMANS_NATIVE_WHEEL: /tmp/sbml4humans-native-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          # a release run restores no cache, which zizmor cannot tell from the
          # expression: the distributions of a tag are built from a clean state
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'npm' || '' }}  # zizmor: ignore[cache-poisoning]
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
          # a release run restores no cache, see the cache of npm above
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
      - name: Build the frontend into the package
        working-directory: frontend
        run: |
          npm ci
          npm run build:package
      - name: Download the exact native runtime
        uses: actions/download-artifact@v8
        with:
          name: native-runtime
          path: /tmp/sbml4humans-native-runtime
      - name: Build the wheel and the sdist
        working-directory: backend
        run: |
          uv sync --locked --only-group build --no-install-project
          uv build --no-build-isolation --out-dir ../dist
      - name: Check that the wheel and the sdist carry the license
        run: |
          unzip -l dist/*.whl | grep --quiet 'dist-info/licenses/LICENSE$'
          tar --list --file dist/*.tar.gz | grep --quiet '^sbml4humans-[^/]*/LICENSE$'
      - name: Open a report with the installed wheel
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          # outside of the checkout, so that the package which is tested is the installed one
          cd "$RUNNER_TEMP"
          venv/bin/python -c 'import importlib.util; import sbml4humans.api; from sbml4humans.native import _reader; assert _reader().HOST_CONTRACT == "host/1"; assert all(importlib.util.find_spec(name) is None for name in ("sbml4humans_core", "libsbml", "lxml", "numpy", "pint", "sbmlsim_core"))'
          model="$GITHUB_WORKSPACE/backend/sbml4humans/resources/examples/comp_deletion.xml"
          url="$(venv/bin/sbml4humans --no-browser "$model")"
          echo "$url"
          curl --fail --silent "$url" | grep --quiet '<div id="app">'
          report="${url%%/report*}/api/local/reports/${url##*local=}"
          curl --fail --silent "$report" | grep --quiet '"./unit_definitions.xml"'
          venv/bin/sbml4humans --stop
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  parser:
    name: parser
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the production Rust-only backend image
        run: |
          docker build -t sbml4humans-parser-check .
          docker run --rm --entrypoint python sbml4humans-parser-check -c 'import sys; import sbml4humans.api; from sbml4humans.native import _reader; c = _reader(); assert c.HOST_CONTRACT == "host/1"; assert not ({"libsbml", "lxml", "numpy", "pint", "sbmlsim_core"} & set(sys.modules))'

  ruff:
    # required by the branch protection, see .github/rulesets/develop.json
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # the ruff version is read from the dev dependencies in backend/pyproject.toml
      - name: Lint
        # astral-sh/ruff-action publishes no floating major tag beyond v3
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: backend
          args: check --output-format=github
      - name: Format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: backend
          args: format --check --diff

  ty:
    # required by the branch protection, see .github/rulesets/develop.json
    name: ty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: true
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: true
      - name: Install the backend
        working-directory: backend
        run: uv sync --locked --no-install-project
      - name: Type check
        working-directory: backend
        env:
          # render diagnostics as GitHub Actions workflow annotations
          TY_OUTPUT_FORMAT: github
        run: uv run --no-sync ty check

  docs:
    # required by the branch protection, see .github/rulesets/develop.json
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: native
    env:
      SBML4HUMANS_NATIVE_WHEEL: /tmp/sbml4humans-native-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: true
          # the interpreter is cached with the packages instead of downloaded by every run
          cache-python: true
      - name: Download the exact native runtime
        uses: actions/download-artifact@v8
        with:
          name: native-runtime
          path: /tmp/sbml4humans-native-runtime
      - name: Install the backend
        # the dev group, which zensical is part of, is installed by default
        working-directory: backend
        run: uv sync --locked
      - name: Check that the generated reference is current
        run: uv run --project backend python -m sbml4humans.glossary --check
      - name: Check that the release notes page is current
        run: uv run --project backend python -m sbml4humans.releasenotes --check
      - name: Build the documentation
        # --strict turns a broken link or a broken anchor of a page into a failure
        run: uv run --project backend zensical build --clean --strict
      - name: Upload the site
        # only the branch which deploys needs the artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: docs
    # only the default branch publishes to https://matthiaskoenig.github.io/sbml4humans
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # deploy to GitHub Pages
      id-token: write  # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: [test, schema, frontend, e2e, parser, docs, ruff, ty, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: "release-notes/${{ github.ref_name }}.md"
          draft: false
          prerelease: false

  sync-main:
    # main tracks the latest release, see "Branches and pull requests" in docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
      - uses: actions/checkout@v7
        with:
          # a shallow clone cannot be pushed to another branch
          fetch-depth: 0
      - name: Fast-forward main to the release
        # no --force: the push fails loudly if it would not be a fast-forward
        run: git push origin HEAD:main

  publish:
    # the package on PyPI, by trusted publishing: the project on PyPI names this repository,
    # this workflow and the environment `pypi` as its publisher, see docs/development.md.
    # Next to the GitHub release and not before it: main follows the release either way.
    needs: [release, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sbml4humans/
    permissions:
      id-token: write  # the identity PyPI trusts
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
