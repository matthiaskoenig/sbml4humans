name: Rust parser

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parser:
    name: parser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"
      - name: Install the parser toolchain and native WASM target
        run: rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
      - name: Rebuild and verify the pinned browser package; build the native wheel
        run: python3 scripts/build_parser.py --check --verify-build --wheel-out /tmp/parser-wheels
      - name: Install the application and the real native wheel
        run: |
          uv sync --project backend --locked
          uv pip install --python backend/.venv/bin/python --no-deps /tmp/parser-wheels/*.whl
          backend/.venv/bin/python -c 'import sbml4humans_core; assert sbml4humans_core.SOURCE_CONTRACT == "source/1"'
      - name: Check the parser build script
        run: |
          uv run --no-sync --project backend ruff check --config backend/pyproject.toml scripts/build_parser.py
          uv run --no-sync --project backend ruff format --check --config backend/pyproject.toml scripts/build_parser.py
      - name: Test native report integration and isolated requests
        working-directory: backend
        env:
          SBML4HUMANS_PARSER: rust
        run: |
          uv run --no-sync python -c 'import sbml4humans_core; assert sbml4humans_core.SOURCE_CONTRACT == "source/1"'
          uv run --no-sync pytest tests/test_native.py -q
      - name: Build the production native backend image
        run: |
          docker build -t sbml4humans-parser-check .
          docker run --rm --entrypoint python sbml4humans-parser-check -c 'from sbml4humans.native import _reader; assert _reader() is not None'
