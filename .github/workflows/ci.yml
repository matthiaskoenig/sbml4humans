name: CI

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release job raises what it needs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # superseded branch runs are cancelled, release runs are never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    # required by the branch protection, see .github/rulesets/develop.json
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the backend
        working-directory: backend
        run: uv sync
      - name: Test the backend
        working-directory: backend
        run: uv run pytest

  schema:
    # required by the branch protection, see .github/rulesets/develop.json
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the backend
        working-directory: backend
        run: uv sync
      - name: Check that the committed JSON schema is current
        working-directory: backend
        run: |
          uv run python -m sbml4humans.schema /tmp/report.schema.json
          diff /tmp/report.schema.json ../frontend/src/schema/report.schema.json

  frontend:
    # required by the branch protection, see .github/rulesets/develop.json
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend
        working-directory: frontend
        run: npm ci
      - name: Check that the generated types are current
        working-directory: frontend
        run: |
          npm run types
          git diff --exit-code -- src/types/report.ts
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    # required by the branch protection, see .github/rulesets/develop.json
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the backend
        working-directory: backend
        run: uv sync
      - name: Start the backend
        working-directory: backend
        run: |
          uv run uvicorn sbml4humans.api:api --port 1444 &
          for i in $(seq 1 30); do curl -fs http://localhost:1444/api/examples > /dev/null && break; sleep 1; done
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End to end tests
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  package:
    # the python package as a user installs it: the wheel with the built frontend in it,
    # installed into an environment of its own, opens the report of a file
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Build the frontend into the package
        working-directory: frontend
        run: |
          npm ci
          npm run build:package
      - name: Build the wheel and the sdist
        working-directory: backend
        run: uv build --out-dir ../dist
      - name: Open a report with the installed wheel
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          # outside of the checkout, so that the package which is tested is the installed one
          cd "$RUNNER_TEMP"
          model="$GITHUB_WORKSPACE/backend/sbml4humans/resources/examples/comp_deletion.xml"
          url="$(venv/bin/sbml4humans --no-browser "$model")"
          echo "$url"
          curl --fail --silent "$url" | grep --quiet '<div id="app">'
          report="${url%%/report*}/api/local/reports/${url##*local=}"
          curl --fail --silent "$report" | grep --quiet '"./unit_definitions.xml"'
          venv/bin/sbml4humans --stop
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: [test, schema, frontend, e2e]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # create the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: "release-notes/${{ github.ref_name }}.md"
          draft: false
          prerelease: false

  sync-main:
    # main tracks the latest release, see "Branches and pull requests" in docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
      - uses: actions/checkout@v7
        with:
          # a shallow clone cannot be pushed to another branch
          fetch-depth: 0
      - name: Fast-forward main to the release
        # no --force: the push fails loudly if it would not be a fast-forward
        run: git push origin HEAD:main

  publish:
    # the package on PyPI, by trusted publishing: the project on PyPI names this repository,
    # this workflow and the environment `pypi` as its publisher, see docs/development.md.
    # Next to the GitHub release and not before it: main follows the release either way.
    needs: [test, schema, frontend, e2e, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sbml4humans/
    permissions:
      id-token: write  # the identity PyPI trusts
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
