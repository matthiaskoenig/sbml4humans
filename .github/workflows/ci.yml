name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # the backend depends on the sbmlutils checkout next to the repository
      # (see [tool.uv.sources] in backend/pyproject.toml), which also provides
      # the curated biomodels served as examples
      - uses: actions/checkout@v7
        with:
          path: sbml4humans
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: matthiaskoenig/sbmlutils
          path: sbmlutils
          persist-credentials: false
      - name: Install the python dev files
        # the extension of libroadrunner links against libpython, which the
        # standalone interpreters do not put on the library search path
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.14-dev
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install the backend
        working-directory: sbml4humans/backend
        run: uv sync
      - name: Test the backend
        working-directory: sbml4humans/backend
        run: uv run pytest
