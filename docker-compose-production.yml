# -----------------------------------------------------------------------------
# DOCKER COMPOSE DEPLOYMENT
# -----------------------------------------------------------------------------
# build containers
#   sudo docker compose -f docker-compose-production.yml build --no-cache
#   sudo docker compose -f docker-compose-production.yml build
# serve containers
#   sudo docker compose -f docker-compose-production.yml up
#   sudo docker compose -f docker-compose-production.yml up --detach
# -----------------------------------------------------------------------------
volumes:
  uploads:
    driver: local
  vue_dist:
    driver: local
  node_modules:
    driver: local

services:

  backend:
    restart: always
    build: .
    # the image carries the code, nothing of the host is mounted. The backend is reachable through
    # the docker network alone, by the nginx container: a published port would bypass nginx and
    # the firewall of the host, which docker circumvents
    volumes:
      # the uploads of other tools, kept for 24 hours (POST /api/upload)
      - uploads:/uploads
    environment:
      SBML4HUMANS_UPLOADS: /uploads
    expose:
      - "1444"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-production
      # the commit the footer links, from the environment of the host, e.g. `deploy.sh`
      args:
        VITE_COMMIT: "${VITE_COMMIT:-}"
    command: tail -f /dev/null
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules/
      - vue_dist:/vue

  nginx:
    restart: always
    image: nginx:1.28
    ports:
      - 8084:80
    volumes:
      - ./nginx/config/conf.d:/etc/nginx/conf.d
      - vue_dist:/vue
    depends_on:
      - backend
      - frontend
    links:
      - backend:backend
