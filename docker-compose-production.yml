# -----------------------------------------------------------------------------
# DOCKER COMPOSE DEPLOYMENT
# -----------------------------------------------------------------------------
# build containers
#   sudo docker compose -f docker-compose-production.yml build --no-cache
#   sudo docker compose -f docker-compose-production.yml build
# serve containers
#   sudo docker compose -f docker-compose-production.yml up
#   sudo docker compose -f docker-compose-production.yml up --detach
# -----------------------------------------------------------------------------
volumes:
  uploads:
    driver: local
  cache:
    driver: local
  vue_dist:
    driver: local
  node_modules:
    driver: local

services:

  backend:
    restart: always
    build: .
    # the image carries the code, nothing of the host is mounted. The backend is reachable through
    # the docker network alone, by the nginx container: a published port would bypass nginx and
    # the firewall of the host, which docker circumvents
    volumes:
      # the uploads of other tools, kept for 24 hours (POST /api/upload)
      - uploads:/uploads
      # the answers of OLS, ChEBI, UniProt and the registry, kept across a restart of the container, a deploy removes the volume
      - cache:/cache
    environment:
      SBML4HUMANS_UPLOADS: /uploads
      SBML4HUMANS_CACHE: /cache
      # the validations which run at a time, each in a child process which may use up to 2 GiB of
      # memory: 2 x 2 GiB on top of the backend itself, see deploy.md before raising it. Without it
      # half the cpus of the host would validate at a time, a cpu quota of docker does not count
      SBML4HUMANS_VALIDATIONS: "2"
      # the reports of a request which are built at a time, each in a child process which may use
      # up to 4 GiB of memory: 1 x 4 GiB for the reports on top of the 2 x 2 GiB of the validations,
      # 8 GiB of children with the backend on top of them, which is one report until the memory
      # of the host is measured - read deploy.md before raising it. Without it half the cpus of the
      # host would report at a time, as for the validations. The ODE downloads of a request share
      # these children, and the proxy limits what one client may ask of them (nginx/sbml4humans.de)
      SBML4HUMANS_REPORTS: "1"
    expose:
      - "1444"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile-production
      # the commit the footer links, from the environment of the host, e.g. `deploy.sh`
      args:
        VITE_COMMIT: "${VITE_COMMIT:-}"
    command: tail -f /dev/null
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules/
      - vue_dist:/vue

  nginx:
    restart: always
    image: nginx:1.30.6
    ports:
      - 8084:80
    volumes:
      - ./nginx/config/conf.d:/etc/nginx/conf.d
      - vue_dist:/vue
    depends_on:
      - backend
      - frontend
    links:
      - backend:backend
