# TLS settings of the proxy, included by every https server of the site
# (/etc/nginx/snippets/ssl.conf). Mozilla "intermediate" profile: TLS 1.2 and 1.3 only, forward
# secret AEAD ciphers only. TLS 1.3 chooses its own ciphers, the list below is for TLS 1.2.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;

ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# No OCSP stapling: Let's Encrypt ended its OCSP service in 2025, its certificates carry no OCSP
# url, and `ssl_stapling on` only logs warnings for them.
