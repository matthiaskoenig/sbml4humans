# The nginx container of docker-compose-production.yml: serves the built frontend from the
# vue_dist volume and proxies /api to the backend container. It sits behind the proxy of
# sbml4humans.de (nginx/sbml4humans.de), which terminates https and adds the security headers.

upstream backend_server {
    server backend:1444;
}

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    client_max_body_size 100m;
    proxy_connect_timeout       900;
    proxy_send_timeout          900;
    proxy_read_timeout          900;
    send_timeout                900;

    # Compression of the frontend and of the JSON of the api. text/html is always compressed.
    # `gzip_proxied any` compresses the responses of requests which arrive through a proxy too.
    # nginx never compresses a response which already has a Content-Encoding, so a backend which
    # compresses its responses itself (GZipMiddleware) is passed through, never compressed twice.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain text/xml application/xml font/ttf;

    # uvicorn backend
    location /api {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # the files of the build whose names carry the hash of their content never change
    location /assets/ {
        root /vue;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # vue.js frontend: index.html (also the fallback of every route of the single page
    # application) and the files of public/ are revalidated on every request, so that a
    # deployment reaches the browsers at once
    location / {
        root /vue;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
