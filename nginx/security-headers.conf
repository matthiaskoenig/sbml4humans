# Security headers of sbml4humans.de (/etc/nginx/snippets/sbml4humans-security-headers.conf).
# Included in every server block and every location which sets headers of its own, because a
# location with an `add_header` drops the ones it would otherwise inherit. `always` adds them to
# error responses too.

# https only for a year, the browser never tries http again
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# no embedding in frames, for browsers which ignore `frame-ancestors` of the policy below
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Content-Security-Policy of the built frontend (frontend/dist):
# - default-src 'self': everything not listed below comes from sbml4humans.de alone; the api is
#   the same origin (https://sbml4humans.de/api, VITE_API_URL of frontend/.env.production).
# - script-src: the module scripts of /assets/ (the build has no inline script and no eval) and
#   gtag.js of Google Analytics, which vue-gtag loads from www.googletagmanager.com
#   (frontend/src/analytics.ts).
# - style-src 'unsafe-inline': KaTeX, Floating UI and the Vue components set style attributes.
# - img-src https: data:: the notes of a model show images from anywhere, KaTeX and the
#   stylesheets use data: urls, Google Analytics may send hits as images.
# - font-src 'self' data:: the KaTeX fonts are built into /assets/, the smallest inlined as data: urls.
# - connect-src: the api and the glossary details (same origin) and the hits of Google
#   Analytics, including its regional collection endpoints and Google Signals.
# - frame-ancestors 'none': never embedded in a frame (clickjacking).
# - object-src, base-uri, form-action: no plugins, no foreign <base>, no foreign form target.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.g.doubleclick.net; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
