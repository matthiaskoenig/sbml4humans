# -----------------------------------------------------------------------------
# DOCKER COMPOSE DEVELOPMENT
# -----------------------------------------------------------------------------
#
# build containers
#   sudo docker compose -f docker-compose-develop.yml build --no-cache
#   sudo docker compose -f docker-compose-develop.yml build
# serve containers
#   sudo docker compose -f docker-compose-develop.yml up --detach
#   sudo docker compose -f docker-compose-develop.yml up
# -----------------------------------------------------------------------------
volumes:
  uploads:
    driver: local
  node_modules:
    driver: local

services:

  backend:
    restart: always
    build: .
    volumes:
      # the working tree, read-only: the container runs as an unprivileged user and writes nothing
      # but the uploads
      - .:/code:ro
      # the uploads of other tools, kept for 24 hours (POST /api/upload)
      - uploads:/uploads
    environment:
      SBML4HUMANS_UPLOADS: /uploads
    expose:
      - "1444"
    ports:
      - "1444:1444"

  frontend:
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile-develop
    ports:
      - "8083:3456"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules/
