# The glossary of what the report adds to a model: the kinds of the links
# between the elements and the fields the report computes. It follows the
# format of `core.toml`: the summary becomes a tooltip of the application, the
# description becomes a section of `docs/reference/links.md` or of
# `docs/reference/concepts.md`. Run `uv run python -m sbml4humans.glossary`
# after a change and commit the generated files.
#
# The link kinds are those of `frontend/src/data/edgeKinds.ts`, and the label
# of a kind, which the inspector shows for the group, is its key: the name of
# the attribute which makes the reference. `summary` is one sentence without a
# final period, `description` is markdown without hard line wraps.

# ----------------------------------------------------------------------------
# the kinds of the links between the elements of a report
# ----------------------------------------------------------------------------
[links.compartment]
label = "compartment"
summary = "the compartment a species or a qualitative species is located in, or a reaction takes place in"
description = """
Every [species](species.md) and every [qualitative species](qualitativespecies.md) names the compartment it is located in, and a [reaction](reaction.md) may name the compartment it takes place in.

The link is shown under "References" of the species, of the qualitative species or of the reaction, and under "Referenced by" of the compartment, which is where every species of a compartment can be seen at once.
"""

[links.reactant]
label = "reactant"
summary = "a species a reaction consumes"
description = """
The link is two links of one kind: from the [reaction](reaction.md) to every [species reference](speciesreference.md) of its list of reactants, and from each of those to the [species](species.md) it names. Every link starts at the element which carries the reference, so a species reference is part of the graph instead of standing alone.

It is shown under "References" of the reaction, where it lists what the reaction consumes, and under "Referenced by" of the species, where it answers which reactions consume it.
"""

[links.product]
label = "product"
summary = "a species a reaction produces"
description = """
The link is two links of one kind: from the [reaction](reaction.md) to every [species reference](speciesreference.md) of its list of products, and from each of those to the [species](species.md) it names.

It is shown under "References" of the reaction and under "Referenced by" of the species, where it answers which reactions produce it.
"""

[links.modifier]
label = "modifier"
summary = "a species which influences a reaction without being consumed"
description = """
The link is two links of one kind: from the [reaction](reaction.md) to every [modifier species reference](modifierspeciesreference.md) of its list of modifiers, and from each of those to the [species](species.md) it names: a catalyst, an inhibitor or an activator.

It is shown under "References" of the reaction and under "Referenced by" of the species. A species which is a modifier of a reaction usually also appears in the math of its kinetic law, which is a link of the kind "math".
"""

[links.kineticLaw]
label = "kineticLaw"
summary = "the formula which gives the speed of a reaction"
description = """
A [reaction](reaction.md) holds the formula of its speed in a [kinetic law](kineticlaw.md) of its own, and the link runs from the reaction to it. The elements the formula reads are linked from the kinetic law with [math](links.md#math) links, and its local parameters are among them.

It is shown under "References" of the reaction and under "Referenced by" of the kinetic law. A reaction has one kinetic law at most, and its formula is the speed of the reaction, so the other links look across it: the reaction lists what its formula reads under "math", and a species or a parameter the formula reads lists the reaction there, not the kinetic law. The kinetic law keeps its own links.
"""

[links.localParameter]
label = "localParameter"
summary = "a parameter which only the formula of one kinetic law can read"
description = """
A [kinetic law](kineticlaw.md) names every [local parameter](localparameter.md) it lists, whether its formula reads it or not. A local parameter is not part of the identifiers of the model, only the formula of its own kinetic law can name it, so this link is what says which reaction a local parameter belongs to.

It is shown under "References" of the kinetic law and under "Referenced by" of the local parameter.
"""

[links.trigger]
label = "trigger"
summary = "the condition an event fires on"
description = """
An [event](event.md) holds its condition in a [trigger](trigger.md) of its own, and the link runs from the event to it. The elements the condition reads are linked from the trigger, not from the event, so a reader sees which of the formulas of an event uses a species or a parameter.

It is shown under "References" of the event and under "Referenced by" of the trigger.
"""

[links.priority]
label = "priority"
summary = "the formula which orders an event against the events of the same moment"
description = """
An [event](event.md) may hold a [priority](priority.md) of its own, and the link runs from the event to it.

It is shown under "References" of the event and under "Referenced by" of the priority.
"""

[links.delay]
label = "delay"
summary = "the formula which postpones the execution of an event"
description = """
An [event](event.md) may hold a [delay](delay.md) of its own, and the link runs from the event to it.

It is shown under "References" of the event and under "Referenced by" of the delay.
"""

[links.eventAssignment]
label = "eventAssignment"
summary = "a new value an event gives to an element of the model"
description = """
An [event](event.md) names every [event assignment](eventassignment.md) of its list, and each assignment names the element it sets with a [variable](links.md#variable) link and the elements its formula reads with [math](links.md#math) links. An assignment carries no identifier in most models, so this link is what says which event it belongs to.

It is shown under "References" of the event and under "Referenced by" of the assignment.
"""

[links.variable]
label = "variable"
summary = "the element a rule, an event assignment or a constraint component is about"
description = """
An [assignment rule](assignmentrule.md), a [rate rule](raterule.md) and an [event assignment](eventassignment.md) name the element they set in their variable: a compartment, a species, a parameter or the stoichiometry of a species reference. A [component](userdefinedconstraintcomponent.md) of a user defined constraint of fbc names the reaction or the parameter it weighs with the same attribute, which it does not set but reads; the second factor of a quadratic component is a link of its own, [second variable](links.md#variable2).

The link is shown under "References" of the rule or of the assignment, and under "Referenced by" of the element, where it shows what determines its value.
"""

[links.variable2]
label = "variable2"
summary = "the second factor of a quadratic term of a user defined constraint"
description = """
A quadratic [component](userdefinedconstraintcomponent.md) of a user defined constraint weighs the product of two variables, the reaction or the parameter of its [variable](links.md#variable) and the one of its [second variable](userdefinedconstraintcomponent.md#variable2). The second one has a link of its own, so that the element it names says that it is the second factor of a product and not a term of its own.

It is shown under "References" of the component and under "Referenced by" of the reaction or the parameter.
"""

[links.symbol]
label = "symbol"
summary = "the element whose initial value an initial assignment computes"
description = """
An [initial assignment](initialassignment.md) names the element it computes in its symbol. It is the same relation as the variable of a rule, at the start of the simulation instead of during it, and the specification gives it a name of its own.

The link is shown under "References" of the initial assignment and under "Referenced by" of the element.
"""

[links.units]
label = "units"
summary = "the unit definition an element declares its units with"
description = """
A [model](model.md), a [compartment](compartment.md), a [species](species.md), a [parameter](parameter.md), a [local parameter](localparameter.md) and an [uncert parameter](uncertparameter.md) may name a [unit definition](unitdefinition.md) of the model in one of their units attributes. A units attribute which names a base unit of SBML instead of a unit definition produces no link, because there is no element to link to.

Two more references carry the same relation. A number in a formula of Level 3 may name its units with the attribute `sbml:units`, and the element which holds the formula links that unit definition. A model of Level 1 or Level 2 changes the units every element without units of its own uses by defining a unit of the id `substance`, `time`, `volume`, `area` or `length`, and the model links such a definition, the way a model of Level 3 links the unit definitions of its units attributes.

The link is shown under "References" of the element and under "Referenced by" of the unit definition, where it shows which elements are measured in it.
"""

[links.conversionFactor]
label = "conversionFactor"
summary = "the parameter which converts the values of an element"
description = """
A [model](model.md) and a [species](species.md) name a conversion factor parameter for the amounts of species, and a [replaced element](replacedelement.md) names one for the element it replaces. In every case the link goes to a constant [parameter](parameter.md) of the model. The two conversion factors of a [submodel](submodel.md) are links of their own, [time conversion factor](links.md#timeconversionfactor) and [extent conversion factor](links.md#extentconversionfactor).

It is shown under "References" of the element and under "Referenced by" of the parameter.
"""

[links.timeConversionFactor]
label = "timeConversionFactor"
summary = "the parameter which converts the time of a submodel"
description = """
A [submodel](submodel.md) names the [parameter](parameter.md) which converts the units of time of the model it instantiates into the units of time of the model which contains it, in its [time conversion factor](submodel.md#timeconversionfactor).

It is shown under "References" of the submodel and under "Referenced by" of the parameter.
"""

[links.extentConversionFactor]
label = "extentConversionFactor"
summary = "the parameter which converts the reaction extent of a submodel"
description = """
A [submodel](submodel.md) names the [parameter](parameter.md) which converts the units of reaction extent of the model it instantiates into those of the model which contains it, in its [extent conversion factor](submodel.md#extentconversionfactor).

It is shown under "References" of the submodel and under "Referenced by" of the parameter.
"""

[links.fluxBound]
label = "fluxBound"
summary = "the reaction a flux bound of fbc Version 1 constrains"
description = """
In a document of fbc Version 1 a [flux bound](fluxbound.md) is an object of its own, which names the [reaction](reaction.md) whose flux it constrains together with an operation and a value. From Version 2 on the bounds are attributes of the reaction, which names their parameters with a [lower flux bound](links.md#lowerfluxbound) and an [upper flux bound](links.md#upperfluxbound) link.

The link is shown under "References" of the flux bound and under "Referenced by" of the reaction, where it shows what bounds its flux.
"""

[links.lowerFluxBound]
label = "lowerFluxBound"
summary = "the parameter which holds the lowest flux of a reaction"
description = """
A [reaction](reaction.md) of a model which uses fbc Version 2 or later names the [parameter](parameter.md) of its [lower flux bound](reaction.md#fbc-lowerfluxbound). A genome scale model gives hundreds of reactions the same parameter, and the link says of every one of them that it is their lower bound.

It is shown under "References" of the reaction and under "Referenced by" of the parameter.
"""

[links.upperFluxBound]
label = "upperFluxBound"
summary = "the parameter which holds the highest flux of a reaction"
description = """
A [reaction](reaction.md) of a model which uses fbc Version 2 or later names the [parameter](parameter.md) of its [upper flux bound](reaction.md#fbc-upperfluxbound). A genome scale model gives hundreds of reactions the same parameter, and the link says of every one of them that it is their upper bound.

It is shown under "References" of the reaction and under "Referenced by" of the parameter.
"""

[links.geneProduct]
label = "geneProduct"
summary = "a gene product a reaction needs, named by a reference of its association"
description = """
The link goes from a [gene product reference](geneproductref.md), the leaf of the gene product association of a reaction, to the [gene product](geneproduct.md) it names. It starts at the reference and not at the [reaction](reaction.md) because that is where the file writes the identifier, and because a reaction may name one gene in several branches of its association.

It is shown under "References" of the reference and under "Referenced by" of the gene product. The inspector looks across the tree of the association, which is the question a reader asks: a reaction lists the gene products it needs under this kind, and a gene product lists the reactions which need it, each of them once.
"""

[links.geneProductAssociation]
label = "geneProductAssociation"
summary = "a node of the gene association of a reaction, from the reaction down to its genes"
description = """
A [reaction](reaction.md) names the [gene product association](geneproductassociation.md) it carries, the association names the node at the root of its tree, and every [and](and.md) and [or](or.md) names the nodes below it, all of them with this kind. The tree ends at the [gene product references](geneproductref.md), which name the genes.

The chain is what makes the structure of the association walkable: it says which genes belong to the same complex and which of them are alternatives, which the flat list of the genes of a reaction cannot.

It is shown under "References" of the reaction and of every node, and under "Referenced by" of the node below.
"""

[links.associatedSpecies]
label = "associatedSpecies"
summary = "the species a gene product stands for"
description = """
A [gene product](geneproduct.md) may name the [species](species.md) which represents it in the reaction network, which is how some reconstructions encode gene products.

The link is shown under "References" of the gene product and under "Referenced by" of the species.
"""

[links.fluxObjective]
label = "fluxObjective"
summary = "a term of an objective function and the reaction whose flux it weighs"
description = """
An [objective](objective.md) names every [flux objective](fluxobjective.md) it is the sum of, and each of those names the [reaction](reaction.md) whose flux it weighs. Both hops carry this kind, the way a reaction and its species reference both carry the kind of the participation. From Version 3 of fbc on a quadratic term may multiply the flux with the flux of a second reaction, which is a link of its own, [second reaction](links.md#reaction2).

The coefficient is an attribute of the flux objective, not of the link. The chain is shown under "References" of the objective and of the flux objective, and under "Referenced by" of the reaction, where it says that this reaction is what the model optimises.
"""

[links.reaction2]
label = "reaction2"
summary = "the second flux of a quadratic term of an objective"
description = """
A quadratic [flux objective](fluxobjective.md) of fbc Version 3 weighs the product of the flux of its reaction and the flux of its [second reaction](fluxobjective.md#reaction2). The second one has a link of its own, so that the reaction it names says that it is the second factor of a product and not a term of the objective of its own.

It is shown under "References" of the flux objective and under "Referenced by" of the reaction.
"""

[links.activeObjective]
label = "activeObjective"
summary = "the objective a model declares as the one which is optimised"
description = """
A [model](model.md) which defines several [objectives](objective.md) names the one an analysis optimises unless it is told otherwise. It is the only link which starts at the model itself, because the attribute belongs to the list of the objectives, which the report shows as the section of that type.

It is shown under "References" of the model and under "Referenced by" of the objective, where it says that this objective is the one the model was published with.
"""

[links.lowerBound]
label = "lowerBound"
summary = "the parameter which holds the lowest value of a user defined constraint"
description = """
A [user defined constraint](userdefinedconstraint.md) keeps the weighted sum of its components between two numbers, and it names the [parameter](parameter.md) of the lower one in its [lower bound](userdefinedconstraint.md#lowerbound). The bound limits the sum and not the flux of one reaction, which is why it is not a flux bound.

It is shown under "References" of the constraint and under "Referenced by" of the parameter.
"""

[links.upperBound]
label = "upperBound"
summary = "the parameter which holds the highest value of a user defined constraint"
description = """
A [user defined constraint](userdefinedconstraint.md) keeps the weighted sum of its components between two numbers, and it names the [parameter](parameter.md) of the upper one in its [upper bound](userdefinedconstraint.md#upperbound). The bound limits the sum and not the flux of one reaction, which is why it is not a flux bound.

It is shown under "References" of the constraint and under "Referenced by" of the parameter.
"""

[links.constraintComponent]
label = "constraintComponent"
summary = "a term of a user defined constraint"
description = """
A [user defined constraint](userdefinedconstraint.md) names every [component](userdefinedconstraintcomponent.md) it is the sum of, the way a reaction names its species references, and each component names the variable it weighs and the parameter of its coefficient with links of their own.

It is shown under "References" of the constraint and under "Referenced by" of the component.
"""

[links.coefficient]
label = "coefficient"
summary = "the parameter which holds the weight of a term"
description = """
A [component](userdefinedconstraintcomponent.md) of a user defined constraint does not write its weight into the file: it names the [parameter](parameter.md) which holds it, so that the weights of a model are changed in one place.

It is shown under "References" of the component and under "Referenced by" of the parameter, where it says which constraints a number belongs to.
"""

[links.input]
label = "input"
summary = "a qualitative species a transition reads"
description = """
A [transition](transition.md) names every [input](input.md) it lists and each input names the [qualitative species](qualitativespecies.md) whose level it reads, the way a reaction names its species references. The [sign](input.md#sign) of the input says whether that species activates or inhibits, so the inputs and the [outputs](links.md#output) of a model together are its influence graph.

It is shown under "References" of the transition and of the input and under "Referenced by" of the qualitative species, where it says which transitions read it.
"""

[links.output]
label = "output"
summary = "a qualitative species a transition changes"
description = """
A [transition](transition.md) names every [output](output.md) it lists and each output names the [qualitative species](qualitativespecies.md) whose level it changes.

It is shown under "References" of the transition and of the output and under "Referenced by" of the qualitative species, where it says which transitions decide its level.
"""

[links.functionTerm]
label = "functionTerm"
summary = "a row of the transition table of a transition"
description = """
A [transition](transition.md) names every [function term](functionterm.md) of its list, in the order in which they are read, and the math of a term reaches the qualitative species, the inputs and the outputs it names with [math](links.md#math) links of its own.

It is shown under "References" of the transition and under "Referenced by" of the term. The terms are the rows of the table of their transition, so the other links look across them, the way they look across the kinetic law of a reaction: the transition lists what its conditions read under "math", and a qualitative species a condition reads lists the transition there. A term keeps its own links.
"""

[links.defaultTerm]
label = "defaultTerm"
summary = "the term of a transition which holds where no other one does"
description = """
A [transition](transition.md) has exactly one [default term](defaultterm.md), which gives the level of every state its function terms do not cover. It is a link of its own and not a function term link, because the term carries no condition and is the last row of the transition table whatever the order of the others.

It is shown under "References" of the transition and under "Referenced by" of the term.
"""

[links.listOf]
label = "listOf"
summary = "a list of the element which states something of its own"
description = """
An element names every [list](listof.md) it owns which carries a meta id, an SBO term, notes, an annotation, an id or a name: a model its `listOfSpecies`, a reaction its `listOfReactants`, a unit definition its `listOfUnits`. A list which states nothing is no element of the report and has no link. A [port](port.md), a [deletion](deletion.md) or a replacement of the comp package which names a list by its meta id or its id ends at the list with a link of its own kind.

It is shown under "References" of the element which owns the list and under "Referenced by" of the list, which is how a reader gets from a list back to its owner.
"""

[links.uncertainty]
label = "uncertainty"
summary = "a set of measures of how well the value of an element is known"
description = """
An element whose value is uncertain names every [uncertainty](uncertainty.md) it carries, and each uncertainty names the [uncert parameters](uncertparameter.md) which are its measures with [uncert parameter](links.md#uncertparameter) links. An element may carry several uncertainties, one per experiment or publication, so the link is what says which element a set of measures describes.

It is shown under "References" of the element and under "Referenced by" of the uncertainty, which is how a reader gets from an uncertainty back to the value it is about.
"""

[links.uncertParameter]
label = "uncertParameter"
summary = "a measure of an uncertainty"
description = """
An [uncertainty](uncertainty.md) names every [uncert parameter](uncertparameter.md) it lists, and a parameter of the type `distribution` or `externalParameter` names the parameters which define it in turn, so the link carries the whole tree of a distribution.

It is shown under "References" of the uncertainty and of a parameter with parameters of its own, and under "Referenced by" of the measure, which is how a reader gets from a measure back to the set it belongs to.
"""

[links.var]
label = "var"
summary = "the element which holds the number of a measure"
description = """
A measure of an [uncertainty](uncertainty.md) which is not a fixed number names the element of the model which holds it in the [var](uncertparameter.md#var) of an [uncert parameter](uncertparameter.md). The two ends of the interval of an [uncert span](uncertspan.md) are links of their own, [var lower](links.md#varlower) and [var upper](links.md#varupper).

It is shown under "References" of the measure and under "Referenced by" of the element it names, where it says which measurement that element stands for.
"""

[links.varLower]
label = "varLower"
summary = "the element which holds the lower end of the interval of a measure"
description = """
An [uncert span](uncertspan.md) whose lower end is not a fixed number names the element of the model which holds it in its [var lower](uncertspan.md#varlower). The link says of that element that it is the lower end of the interval, which the element does not say itself.

It is shown under "References" of the span and under "Referenced by" of the element it names.
"""

[links.varUpper]
label = "varUpper"
summary = "the element which holds the upper end of the interval of a measure"
description = """
An [uncert span](uncertspan.md) whose upper end is not a fixed number names the element of the model which holds it in its [var upper](uncertspan.md#varupper). The link says of that element that it is the upper end of the interval, which the element does not say itself.

It is shown under "References" of the span and under "Referenced by" of the element it names.
"""

[links.model]
label = "model"
summary = "a model the document holds"
description = """
The [document](sbmldocument.md) names the [model](model.md) it holds and, in a document of the comp package, every model definition of its list, which are models a submodel can instantiate. A model definition which no submodel instantiates is still reached from the document.

It is shown under "References" of the document and under "Referenced by" of the model.
"""

[links.externalModelDefinition]
label = "externalModelDefinition"
summary = "a model of another document which this document refers to"
description = """
The [document](sbmldocument.md) names every [external model definition](externalmodeldefinition.md) of its list. The model behind it lives in another file, which the report follows where it has that file, and a [submodel](submodel.md) instantiates it with a [model reference](links.md#modelref) link.

It is shown under "References" of the document and under "Referenced by" of the external model definition.
"""

[links.modelRef]
label = "modelRef"
summary = "the model a submodel instantiates"
description = """
A [submodel](submodel.md) names the model it instantiates, which is either a [model](model.md) definition of the document or an [external model definition](externalmodeldefinition.md). The reference is resolved against the models of the document, not within one model, because model identifiers live in a namespace of the document. An external model definition names a model in turn, the one of another document, and carries the same link to it where the report has that document.

The link is shown under "References" of the submodel and under "Referenced by" of the model, where it shows who uses it.
"""

[links.port]
label = "port"
summary = "the element a port names"
description = """
A [port](port.md) names exactly one element of its model, by its identifier, by the identifier of a unit definition or by its meta id. All three produce a link of this kind; a port which names a port of a submodel instead is not resolved, because the element lies inside another model.

The link is shown under "References" of the port and under "Referenced by" of the element, where it says that the element is part of the interface of the model.
"""

[links.deletion]
label = "deletion"
summary = "an element which a submodel removes, and the deletion which removes it"
description = """
A [submodel](submodel.md) names every [deletion](deletion.md) it carries, and each deletion names the element of the instantiated model which it removes, so the link leads from the submodel over the deletion to the element which the composed model does not contain. The same kind leads from a [replaced element](replacedelement.md) to the deletion it stands for, which is how a model records that an element of its own takes the place of something a submodel lost.

Where the model of the submodel is one of another document, the link ends at the element of [that document](concepts.md#link-into-another-document) when it is part of the report, as another entry of the same archive. When it is not, the deletion has no element to name and the link ends at the deletion.

The link is shown under "References" of the submodel and of the deletion, and under "Referenced by" of the element which is removed.
"""

[links.replacedBy]
label = "replacedBy"
summary = "the element of a submodel which replaces this one"
description = """
An element which is replaced names the [replacement](replacedby.md) it carries, and the replacement names the element of the [submodel](submodel.md) which takes the place of the element, so the link leads from the replaced element over the replacement to the element which stays in the composed model.

Where the model of the submodel is one of another document, the link ends at the element of [that document](concepts.md#link-into-another-document) when it is part of the report. Where the reference cannot be resolved, because the report does not have the document of an external model or because the named element is not part of it, the link ends at the submodel, which is as far as the report can follow it.

The link is shown under "References" of the replaced element and of the replacement, and under "Referenced by" of the element which replaces it.
"""

[links.replacedElement]
label = "replacedElement"
summary = "the element of a submodel which this one replaces"
description = """
An element may replace elements of submodels. It names every [replacement](replacedelement.md) it carries, and each replacement names the [submodel](submodel.md) it reaches into and the element inside it which disappears from the composed model. It is the opposite direction of "replaced by" and the usual way a composed model connects its parts.

Where the model of the submodel is one of another document, the link ends at the element of [that document](concepts.md#link-into-another-document) when it is part of the report. Where the reference cannot be resolved, because the report does not have the document of an external model or because the named element is not part of it, the link ends at the submodel.

The link is shown under "References" of the replacing element and of the replacement, and under "Referenced by" of the element which is replaced.
"""

[links.sBaseRef]
label = "sBaseRef"
summary = "the next link of a chain of references into a submodel of a submodel"
description = """
A [port](port.md), a [deletion](deletion.md), a [replaced element](replacedelement.md) or a [replaced by](replacedby.md) which has to reach an element deeper than the submodel it names carries a [reference](sbaseref.md) of its own, and that reference may carry the next one. Each of them names the reference it carries. The element at the end of the chain is linked from the object which carries the whole chain, so the links in between only say where they belong.

It is shown under "References" of the object which carries the reference and under "Referenced by" of the reference.
"""

[links.math]
label = "math"
summary = "an element a formula refers to"
description = """
Every formula of a model refers to elements by their identifier: the species and the parameters of a kinetic law, the elements a rule or a trigger reads, the function definition a formula calls. The report collects these symbols of every formula and links each of them to the element it names, resolving the local parameters of a kinetic law before the elements of the model. The arguments of a function definition are local to it and are no references, and a symbol which names nothing, such as the symbol of time, produces no link.

The link is shown under "References" of the element which carries the formula and under "Referenced by" of the element the formula uses, where it answers in which equations a species or a parameter occurs. The formula of a [kinetic law](links.md#kineticlaw) is the speed of its reaction and the condition of a [function term](links.md#functionterm) a row of the table of its transition, so their links are shown as those of the reaction and of the transition, and the kinetic law and the term keep their own.
"""


# ----------------------------------------------------------------------------
# what the report computes on top of the model
# ----------------------------------------------------------------------------
[concepts.pk]
label = "primary key"
summary = "the identifier the report gives to every element it shows"
description = """
SBML identifies an element by its id, which is unique within one model, and many elements of a model have no id at all. The report therefore builds a key of its own for every element, of the form `<scope>/<type>:<id>`: the scope, which is the model the element belongs to or the document for an element of the document, the type of the element and its id. An element without an id falls back to the element it sets, for an [initial assignment](initialassignment.md) or a rule, then to its meta id, and then to a key of what it is about: an element nested in another one is keyed after its parent and what it names, a reactant after its reaction and its species (`Reaction1.reactant.X`), a replacement after its element, its submodel and the element it reaches, a measure of an uncertainty after its type (`u_Km.standardDeviation`), a [list](listof.md) after its owner and its name in the file (`J0.listOfReactants`, and `listOfRules` for a list of the model), and an element which names nothing, an algebraic rule, a constraint, an event or a transition, after its place among the elements of its type (`algebraicRule.0`). Where a list repeats such a key, a species which a reaction lists twice among its reactants, the repetition is told apart by its occurrence (`Reaction1.reactant.X.1`). The model of a document without an id is scoped as `model`, and only an element which the specification requires an id of, and which the file leaves without one, is keyed by a digest of its XML.

The primary key is what the links of a report point at and what the url of a report names when an element is selected. An element without an id is shown by the key alone, without the scope and the type in front of it, in the header of the inspector and as the label of every link to it. An element which the file nests in another one is named after that element and its place in it instead, because a meta id says nothing about where it sits: the kinetic law of `Reaction1` reads `Reaction1.kineticLaw`, the trigger of the event `Start` reads `Start.trigger`, an assignment of that event to `kp` reads `Start.kp`, a reactant `X` of `Reaction1` reads `Reaction1.X` and the list of the reactants of `Reaction1` reads `Reaction1.listOfReactants`.
"""

[concepts.sbmlType]
label = "sbml type"
summary = "the kind of element, which decides how the report shows it"
description = """
Every element of a report carries the name of its SBML class, for example `Species`, `AssignmentRule` or `Objective`. The report groups the elements of a model by it, and it decides the section of the report, the colour and the icon of the type mark, the columns of the table and the attributes the inspector shows.

The type is shown as the mark in front of every element, as the header of every section of the report and in the header of the inspector.
"""

[concepts.derivedUnits]
label = "derived units"
summary = "the units of a quantity or of a formula as they follow from the model"
description = """
A model does not have to declare units everywhere: a compartment, a species or a parameter inherits the units of the model when it declares none, and the units of a formula follow from the units of the elements it uses. The report derives the units which follow from the model, reduces them to base units with their exponent, scale and multiplier, and renders the result as a formula. A quantity without a dimension reads `dimensionless`, and a dash says that the units are not declared or that the model does not say enough to derive them.

Derived units are shown in the column "derived units" of the tables and in the inspector. They are the fastest check whether a kinetic law is dimensionally what it should be, because the derived units of a kinetic law are extent per time when the law is right.
"""

[concepts.number]
label = "number"
summary = "how the report shows a number which is infinite or not a number"
description = """
A double of SBML may be infinite or not a number, `INF`, `-INF` and `NaN` as a file writes them, and both are ordinary values: the upper bound of an unbounded flux is `INF`, and a `NaN` says that a quantity is defined but its number is not known. JSON has no literal for either of them, so the report sends them as the three constants `"Infinity"`, `"-Infinity"` and `"NaN"`, which keeps them apart from `null`, the attribute a file does not set at all.

The report shows an infinite value as the sign of infinity with the direction of its bound, ∞ and -∞, with the `INF` or `-INF` of the file as its tooltip, and a value which is not a number as `NaN`. An attribute which is not set stays the dash every empty cell of the report shows. Every other number is shown with six significant digits, and the full number is the tooltip of the rounded one.
"""

[concepts.equation]
label = "equation"
summary = "the reaction written as a chemical equation"
description = """
The report writes every reaction as its reactants, an arrow and its products, with the stoichiometry in front of a species when it is not one, a minus in front of it when the stoichiometry is minus one, and the identifier of the species reference, or a question mark, when the stoichiometry is set by a rule instead of by a number. The arrow is a double arrow when the reaction is reversible and a single arrow when it is not.

The equation is a column of the table of reactions and a row of the inspector of a reaction, and it is what makes a list of reactions readable without opening any of them.
"""

[concepts.math]
label = "rendered math"
summary = "the formula of an element as the report renders it"
description = """
SBML stores a formula as content MathML, which is precise and unreadable. The report turns it into the typeset formula a textbook would print, with fractions, powers, subscripts for the parts of a name and greek letters where a name is one, and keeps the same expression as an infix formula next to it, so that it can be read and copied as text.

The rendered formula is the column "math" of the tables of rules, function definitions, constraints and events, the kinetic law of a reaction, and the mathematics shown in the inspector. Where a formula names an element of the model, the report also links that element as a link of the kind "math".
"""

[concepts.unitsLatex]
label = "rendered units"
summary = "the units an element declares, rendered as a formula"
description = """
A units attribute names a unit definition, and a unit definition is a list of base units with an exponent, a scale and a multiplier. The report resolves the reference and renders the product as a formula, so that a table shows millimole over litre as a fraction instead of the identifier `mmol_per_l`, next to the identifier it comes from.

The rendered units appear in the units columns of the tables, in the units of the inspector and in the units column of the table of unit definitions, whose inspector shows them as the formula above the units the definition is built from.
"""

[concepts.modelKind]
label = "model kind"
summary = "whether a model is the model of the document or a model definition"
description = """
A document contains at most one model, but the comp package adds model definitions, which exist to be instantiated by a submodel and are not simulated themselves. The report reads both and marks every model as `model` or `modelDefinition`.

The kind is shown in the attributes of a model. The report opens the model of the document first and lets the model definitions be selected next to it.
"""

[concepts.manifest]
label = "manifest"
summary = "the entries of the COMBINE archive a report was built from"
description = """
A COMBINE archive holds the files of a modelling study with a manifest which names every entry, its format and whether it is a master file. The report is built for every SBML entry of the archive, and a plain SBML file which is submitted on its own is wrapped in an archive with one master entry, so that a report always comes with a manifest.

The manifest decides which report is shown first: the master entry when that entry has a report, and the first entry otherwise, because an archive does not have to mark one. It is also what the report offers when an archive holds more than one model.
"""

[concepts.targetEntry]
label = "link into another document"
summary = "a link which ends at an element of another entry of the archive"
description = """
The links of a report stay inside one SBML document, with one exception: a model of the comp package may instantiate a model of another document through an [external model definition](externalmodeldefinition.md), and its [replacements](replacedelement.md), [deletions](deletion.md) and [ports](port.md) then name elements of that document. Where the other document is part of the report, as another entry of the same COMBINE archive, the link ends at the element inside it.

Such a link shows the file name of the other entry next to the element, and following it opens the report of that entry. The element lists the link under "Referenced by" with the file name of the entry it comes from.
"""
